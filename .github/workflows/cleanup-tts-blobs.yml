name: Cleanup TTS Blobs

# Apaga blobs tts/ com mais de 2h do Vercel Blob.
# Roda fora do Vercel porque o Hobby plan não suporta crons sub-diários.
# Secret necessário: BLOB_READ_WRITE_TOKEN (mesmo token da env do Vercel).

on:
  schedule:
    - cron: "15 */2 * * *" # a cada 2h, no minuto :15
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install @vercel/blob
        run: |
          echo '{"type":"module"}' > package.json
          npm install @vercel/blob --silent

      - name: Delete TTS blobs older than 2 hours
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          cat > cleanup.mjs << 'SCRIPT'
          import { list, del } from "@vercel/blob";

          const TWO_HOURS_AGO = Date.now() - 2 * 60 * 60 * 1000;
          const urlsToDelete = [];
          let cursor;

          do {
            const page = await list({
              prefix: "tts/",
              limit: 100,
              ...(cursor ? { cursor } : {}),
            });

            for (const blob of page.blobs) {
              if (new Date(blob.uploadedAt).getTime() < TWO_HOURS_AGO) {
                urlsToDelete.push(blob.url);
              }
            }

            cursor = page.hasMore ? page.cursor : undefined;
          } while (cursor);

          if (urlsToDelete.length === 0) {
            console.log("[TTS Cleanup] 0 blobs para deletar");
          } else {
            await del(urlsToDelete);
            console.log("[TTS Cleanup] Deletados: " + urlsToDelete.length + " blob(s)");
          }
          SCRIPT

          node cleanup.mjs
