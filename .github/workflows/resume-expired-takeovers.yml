name: Resume Expired Takeovers

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Call endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: bash scripts/call-cron-endpoint.sh https://systemops-core.vercel.app/api/cron/resume-expired-takeovers
