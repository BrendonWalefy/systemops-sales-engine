name: Resume Expired Takeovers

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call endpoint
        run: |
          curl -sf -X GET https://systemops-core.vercel.app/api/cron/resume-expired-takeovers \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            | jq .
