name: Conversation Insights

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call endpoint
        run: |
          curl -sf -X GET https://app.systemops.com.br/api/cron/conversation-insights \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            | jq .
