name: Deploy solution architecture to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/github-pages.yml"
      - "docs/solution-site/**"
      - "docs/architecture/diagrams/**"
      - "public/brand/systemops-wordmark-text.png"
      - "public/favicon.svg"
      - "scripts/build-solution-site.mjs"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static architecture site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build static site
        run: node scripts/build-solution-site.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .site-build

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
