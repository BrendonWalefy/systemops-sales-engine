name: Channel Health Alert

on:
  schedule:
    # Evita o topo da hora, onde o GitHub admite maior chance de atraso/drop.
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: channel-health-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Call endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: bash scripts/call-cron-endpoint.sh https://app.systemops.com.br/api/cron/channel-health-alert
