name: Run Migration

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script to run (e.g. scripts/fix-bw-lentes-notes-voice-off.ts)"
        required: true
        type: string

jobs:
  migrate:
    name: Run migration script
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx ${{ github.event.inputs.script }}
